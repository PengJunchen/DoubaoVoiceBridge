name: Windows build and validation

on:
  push:
    branches: ['codex/windows']
    paths: ['windows/**', 'scripts/build-windows.ps1', 'docs/windows/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['windows/**', 'scripts/build-windows.ps1', 'docs/windows/**', '.github/workflows/windows.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Run deterministic core scenarios
        run: dotnet run --project windows/tests/DoubaoVoiceBridge.Tests --configuration Release
      - name: Verify actual diagnostic exports, rotation and configuration recovery
        run: dotnet run --project windows/tests/DoubaoVoiceBridge.DiagnosticsTests --configuration Release

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Native clipboard and input smoke in owned window
        run: dotnet run --project windows/tests/DoubaoVoiceBridge.WindowsSmoke --configuration Release
      - name: Build self-contained x64 and ARM64 packages and checksums
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: DoubaoVoiceBridge-Windows-${{ github.sha }}
          path: |
            dist/windows/*.zip
            dist/windows/*.zip.sha256
          if-no-files-found: error
          retention-days: 14
